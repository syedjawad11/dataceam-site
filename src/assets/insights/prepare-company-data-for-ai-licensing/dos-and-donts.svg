<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
<title id="title">Preparation: what to do and avoid</title>
<desc id="description">Two checklists show how to preserve records and avoid disruptive changes during preparation.</desc>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect x="0" y="0" width="1200" height="720" rx="0" fill="#F3F4F6" stroke="#F3F4F6"/><rect x="48" y="48" width="8" height="50" rx="4" fill="#2563EB" stroke="#2563EB"/><text x="78" y="85" font-size="40" font-weight="700" fill="#111827"><tspan x="78" dy="0">Preparation: what to do and avoid</tspan></text><rect x="48" y="155" width="536" height="480" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><text x="76" y="211" font-size="34" font-weight="700" fill="#2563EB"><tspan x="76" dy="0">Do</tspan></text><rect x="76" y="256" width="26" height="26" rx="6" fill="#DBEAFE" stroke="#E5E7EB"/><path d="M 82 269 l 5 5 9 -11" fill="none" stroke="#2563EB" stroke-width="3"/><text x="118" y="278" font-size="24" font-weight="500" fill="#111827"><tspan x="118" dy="0">List current and retired tools</tspan></text><rect x="76" y="328" width="26" height="26" rx="6" fill="#DBEAFE" stroke="#E5E7EB"/><path d="M 82 341 l 5 5 9 -11" fill="none" stroke="#2563EB" stroke-width="3"/><text x="118" y="350" font-size="24" font-weight="500" fill="#111827"><tspan x="118" dy="0">Record exclusions and rights</tspan></text><rect x="76" y="400" width="26" height="26" rx="6" fill="#DBEAFE" stroke="#E5E7EB"/><path d="M 82 413 l 5 5 9 -11" fill="none" stroke="#2563EB" stroke-width="3"/><text x="118" y="422" font-size="24" font-weight="500" fill="#111827"><tspan x="118" dy="0">Preserve complete work history</tspan></text><rect x="76" y="472" width="26" height="26" rx="6" fill="#DBEAFE" stroke="#E5E7EB"/><path d="M 82 485 l 5 5 9 -11" fill="none" stroke="#2563EB" stroke-width="3"/><text x="118" y="494" font-size="24" font-weight="500" fill="#111827"><tspan x="118" dy="0">Check exports and attachments</tspan></text><rect x="76" y="544" width="26" height="26" rx="6" fill="#DBEAFE" stroke="#E5E7EB"/><path d="M 82 557 l 5 5 9 -11" fill="none" stroke="#2563EB" stroke-width="3"/><text x="118" y="566" font-size="24" font-weight="500" fill="#111827"><tspan x="118" dy="0">Review the cleaned sample</tspan></text><rect x="616" y="155" width="536" height="480" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><text x="644" y="211" font-size="34" font-weight="700" fill="#111827"><tspan x="644" dy="0">Avoid</tspan></text><rect x="644" y="256" width="26" height="26" rx="6" fill="#F3F4F6" stroke="#E5E7EB"/><path d="M 650 269 h 14" stroke="#6B7280" stroke-width="3"/><text x="686" y="278" font-size="24" font-weight="500" fill="#111827"><tspan x="686" dy="0">Deleting old history</tspan></text><rect x="644" y="328" width="26" height="26" rx="6" fill="#F3F4F6" stroke="#E5E7EB"/><path d="M 650 341 h 14" stroke="#6B7280" stroke-width="3"/><text x="686" y="350" font-size="24" font-weight="500" fill="#111827"><tspan x="686" dy="0">Cancelling before exports finish</tspan></text><rect x="644" y="400" width="26" height="26" rx="6" fill="#F3F4F6" stroke="#E5E7EB"/><path d="M 650 413 h 14" stroke="#6B7280" stroke-width="3"/><text x="686" y="422" font-size="24" font-weight="500" fill="#111827"><tspan x="686" dy="0">Scrubbing names by hand</tspan></text><rect x="644" y="472" width="26" height="26" rx="6" fill="#F3F4F6" stroke="#E5E7EB"/><path d="M 650 485 h 14" stroke="#6B7280" stroke-width="3"/><text x="686" y="494" font-size="24" font-weight="500" fill="#111827"><tspan x="686" dy="0">Shortening retention settings</tspan></text><rect x="644" y="544" width="26" height="26" rx="6" fill="#F3F4F6" stroke="#E5E7EB"/><path d="M 650 557 h 14" stroke="#6B7280" stroke-width="3"/><text x="686" y="566" font-size="24" font-weight="500" fill="#111827"><tspan x="686" dy="0">Sharing before terms are agreed</tspan></text><text x="970" y="690" font-size="22" font-weight="500" fill="#111827"><tspan x="970" dy="0">dataceam.com</tspan></text>
</g>
</svg>
