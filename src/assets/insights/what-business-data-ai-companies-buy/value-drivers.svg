<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title description">
<title id="title">What helps or limits a useful archive</title>
<desc id="description">Qualitative bars compare positive signals with limitations; lengths are illustrative, not numerical ratings.</desc>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect x="0" y="0" width="1200" height="750" rx="0" fill="#F3F4F6" stroke="#F3F4F6"/><rect x="48" y="48" width="8" height="50" rx="4" fill="#2563EB" stroke="#2563EB"/><text x="78" y="85" font-size="40" font-weight="700" fill="#111827"><tspan x="78" dy="0">What helps or limits a useful archive</tspan></text><text x="48" y="141" font-size="26" font-weight="500" fill="#111827"><tspan x="48" dy="0">Qualitative signals only — these are not measured scores.</tspan></text><rect x="48" y="180" width="536" height="500" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><text x="76" y="235" font-size="34" font-weight="700" fill="#2563EB"><tspan x="76" dy="0">Raises value</tspan></text><text x="76" y="295" font-size="25" font-weight="500" fill="#111827"><tspan x="76" dy="0">Continuous history</tspan></text><rect x="76" y="310" width="480" height="12" rx="6" fill="#E5E7EB" stroke="#E5E7EB"/><rect x="76" y="310" width="380" height="12" rx="6" fill="#2563EB" stroke="#2563EB"/><text x="76" y="371" font-size="25" font-weight="500" fill="#111827"><tspan x="76" dy="0">Full threads with outcomes</tspan></text><rect x="76" y="386" width="480" height="12" rx="6" fill="#E5E7EB" stroke="#E5E7EB"/><rect x="76" y="386" width="380" height="12" rx="6" fill="#2563EB" stroke="#2563EB"/><text x="76" y="447" font-size="25" font-weight="500" fill="#111827"><tspan x="76" dy="0">Several connected tools</tspan></text><rect x="76" y="462" width="480" height="12" rx="6" fill="#E5E7EB" stroke="#E5E7EB"/><rect x="76" y="462" width="380" height="12" rx="6" fill="#2563EB" stroke="#2563EB"/><text x="76" y="523" font-size="25" font-weight="500" fill="#111827"><tspan x="76" dy="0">Clear ownership</tspan></text><rect x="76" y="538" width="480" height="12" rx="6" fill="#E5E7EB" stroke="#E5E7EB"/><rect x="76" y="538" width="380" height="12" rx="6" fill="#2563EB" stroke="#2563EB"/><text x="76" y="599" font-size="25" font-weight="500" fill="#111827"><tspan x="76" dy="0">Consistent structure</tspan></text><rect x="76" y="614" width="480" height="12" rx="6" fill="#E5E7EB" stroke="#E5E7EB"/><rect x="76" y="614" width="380" height="12" rx="6" fill="#2563EB" stroke="#2563EB"/><rect x="616" y="180" width="536" height="500" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><text x="644" y="235" font-size="34" font-weight="700" fill="#111827"><tspan x="644" dy="0">Lowers value</tspan></text><text x="644" y="295" font-size="25" font-weight="500" fill="#111827"><tspan x="644" dy="0">Short history</tspan></text><rect x="644" y="310" width="480" height="12" rx="6" fill="#E5E7EB" stroke="#E5E7EB"/><rect x="644" y="310" width="130" height="12" rx="6" fill="#6B7280" stroke="#6B7280"/><text x="644" y="371" font-size="25" font-weight="500" fill="#111827"><tspan x="644" dy="0">Gaps in the record</tspan></text><rect x="644" y="386" width="480" height="12" rx="6" fill="#E5E7EB" stroke="#E5E7EB"/><rect x="644" y="386" width="130" height="12" rx="6" fill="#6B7280" stroke="#6B7280"/><text x="644" y="447" font-size="25" font-weight="500" fill="#111827"><tspan x="644" dy="0">Mostly client-owned data</tspan></text><rect x="644" y="462" width="480" height="12" rx="6" fill="#E5E7EB" stroke="#E5E7EB"/><rect x="644" y="462" width="130" height="12" rx="6" fill="#6B7280" stroke="#6B7280"/><text x="644" y="523" font-size="25" font-weight="500" fill="#111827"><tspan x="644" dy="0">Heavy sensitive personal data</tspan></text><rect x="644" y="538" width="480" height="12" rx="6" fill="#E5E7EB" stroke="#E5E7EB"/><rect x="644" y="538" width="130" height="12" rx="6" fill="#6B7280" stroke="#6B7280"/><text x="644" y="599" font-size="25" font-weight="500" fill="#111827"><tspan x="644" dy="0">Unclear rights</tspan></text><rect x="644" y="614" width="480" height="12" rx="6" fill="#E5E7EB" stroke="#E5E7EB"/><rect x="644" y="614" width="130" height="12" rx="6" fill="#6B7280" stroke="#6B7280"/><text x="970" y="720" font-size="22" font-weight="500" fill="#111827"><tspan x="970" dy="0">dataceam.com</tspan></text>
</g>
</svg>
