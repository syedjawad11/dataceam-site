<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title description">
<title id="title">What to put in the data room</title>
<desc id="description">Checklist of the licence, processing agreement, exclusions, sample approval and payment evidence.</desc>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect x="0" y="0" width="1200" height="790" rx="0" fill="#F3F4F6" stroke="#F3F4F6"/><rect x="48" y="48" width="8" height="50" rx="4" fill="#2563EB" stroke="#2563EB"/><text x="78" y="85" font-size="40" font-weight="700" fill="#111827"><tspan x="78" dy="0">What to put in the data room</tspan></text><text x="48" y="145" font-size="26" font-weight="500" fill="#111827"><tspan x="48" dy="0">Give authorised reviewers a clear record of the arrangement.</tspan></text><rect x="48" y="185" width="1104" height="88" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="72" y="210" width="34" height="34" rx="8" fill="#DBEAFE" stroke="#DBEAFE"/><path d="M 81 227 l 6 7 12 -15" fill="none" stroke="#2563EB" stroke-width="3"/><text x="130" y="221" font-size="28" font-weight="700" fill="#111827"><tspan x="130" dy="0">Licence agreement</tspan></text><text x="130" y="252" font-size="23" font-weight="500" fill="#111827"><tspan x="130" dy="0">Scope, permitted uses and continuing obligations</tspan></text><rect x="48" y="291" width="1104" height="88" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="72" y="316" width="34" height="34" rx="8" fill="#DBEAFE" stroke="#DBEAFE"/><path d="M 81 333 l 6 7 12 -15" fill="none" stroke="#2563EB" stroke-width="3"/><text x="130" y="327" font-size="28" font-weight="700" fill="#111827"><tspan x="130" dy="0">Processing terms / DPA</tspan></text><text x="130" y="358" font-size="23" font-weight="500" fill="#111827"><tspan x="130" dy="0">Roles, safeguards and handling of personal data</tspan></text><rect x="48" y="397" width="1104" height="88" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="72" y="422" width="34" height="34" rx="8" fill="#DBEAFE" stroke="#DBEAFE"/><path d="M 81 439 l 6 7 12 -15" fill="none" stroke="#2563EB" stroke-width="3"/><text x="130" y="433" font-size="28" font-weight="700" fill="#111827"><tspan x="130" dy="0">Exclusions list</tspan></text><text x="130" y="464" font-size="23" font-weight="500" fill="#111827"><tspan x="130" dy="0">Sources and categories kept outside the licence</tspan></text><rect x="48" y="503" width="1104" height="88" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="72" y="528" width="34" height="34" rx="8" fill="#DBEAFE" stroke="#DBEAFE"/><path d="M 81 545 l 6 7 12 -15" fill="none" stroke="#2563EB" stroke-width="3"/><text x="130" y="539" font-size="28" font-weight="700" fill="#111827"><tspan x="130" dy="0">Sample sign-off</tspan></text><text x="130" y="570" font-size="23" font-weight="500" fill="#111827"><tspan x="130" dy="0">The cleaned version reviewed and approved</tspan></text><rect x="48" y="609" width="1104" height="88" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><rect x="72" y="634" width="34" height="34" rx="8" fill="#DBEAFE" stroke="#DBEAFE"/><path d="M 81 651 l 6 7 12 -15" fill="none" stroke="#2563EB" stroke-width="3"/><text x="130" y="645" font-size="28" font-weight="700" fill="#111827"><tspan x="130" dy="0">Payment record</tspan></text><text x="130" y="676" font-size="23" font-weight="500" fill="#111827"><tspan x="130" dy="0">Receipt or pending status, with supporting evidence</tspan></text><text x="970" y="760" font-size="22" font-weight="500" fill="#111827"><tspan x="970" dy="0">dataceam.com</tspan></text>
</g>
</svg>
