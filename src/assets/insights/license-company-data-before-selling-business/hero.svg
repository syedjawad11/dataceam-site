<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Licensing alongside a business sale</title>
<desc id="description">Five stages from preparing to sell through closing; preparation and first talks are the best window before the letter of intent.</desc>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<rect x="0" y="0" width="1200" height="675" rx="0" fill="#F3F4F6" stroke="#F3F4F6"/><rect x="48" y="48" width="8" height="50" rx="4" fill="#2563EB" stroke="#2563EB"/><text x="78" y="85" font-size="40" font-weight="700" fill="#111827"><tspan x="78" dy="0">Licensing alongside a business sale</tspan></text><text x="48" y="143" font-size="26" font-weight="500" fill="#111827"><tspan x="48" dy="0">Explore early and disclose openly to your advisers and the acquirer.</tspan></text><rect x="48" y="190" width="432" height="64" rx="14" fill="#DBEAFE" stroke="#DBEAFE"/><text x="72" y="232" font-size="23" font-weight="700" fill="#111827"><tspan x="72" dy="0">BEST WINDOW · BEFORE THE LOI</tspan></text><rect x="48" y="280" width="208" height="267" rx="20" fill="#FFFFFF" stroke="#2563EB"/><text x="66" y="331" font-size="29" font-weight="700" fill="#111827"><tspan x="66" dy="0">Preparing</tspan><tspan x="66" dy="40.599999999999994">to sell</tspan></text><text x="66" y="452" font-size="22" font-weight="500" fill="#111827"><tspan x="66" dy="0">Agree scope</tspan><tspan x="66" dy="36">Check rights</tspan></text><path d="M 258 405 h 12 m -5 -5 l 5 5 -5 5" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="272" y="280" width="208" height="267" rx="20" fill="#FFFFFF" stroke="#2563EB"/><text x="290" y="331" font-size="29" font-weight="700" fill="#111827"><tspan x="290" dy="0">First</tspan><tspan x="290" dy="40.599999999999994">talks</tspan></text><text x="290" y="452" font-size="22" font-weight="500" fill="#111827"><tspan x="290" dy="0">Raise openly</tspan><tspan x="290" dy="36">Involve advisers</tspan></text><path d="M 482 405 h 12 m -5 -5 l 5 5 -5 5" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="496" y="280" width="208" height="267" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><text x="514" y="331" font-size="29" font-weight="700" fill="#111827"><tspan x="514" dy="0">LOI</tspan><tspan x="514" dy="40.599999999999994">signed</tspan></text><text x="514" y="452" font-size="22" font-weight="500" fill="#111827"><tspan x="514" dy="0">Seek consent</tspan><tspan x="514" dy="36">Check restrictions</tspan></text><path d="M 706 405 h 12 m -5 -5 l 5 5 -5 5" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="720" y="280" width="208" height="267" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><text x="738" y="331" font-size="29" font-weight="700" fill="#111827"><tspan x="738" dy="0">Due</tspan><tspan x="738" dy="40.599999999999994">diligence</tspan></text><text x="738" y="452" font-size="22" font-weight="500" fill="#111827"><tspan x="738" dy="0">Allow review</tspan><tspan x="738" dy="36">Update disclosures</tspan></text><path d="M 930 405 h 12 m -5 -5 l 5 5 -5 5" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="944" y="280" width="208" height="267" rx="20" fill="#FFFFFF" stroke="#E5E7EB"/><text x="962" y="331" font-size="29" font-weight="700" fill="#111827"><tspan x="962" dy="0">After</tspan><tspan x="962" dy="40.599999999999994">closing</tspan></text><text x="962" y="452" font-size="22" font-weight="500" fill="#111827"><tspan x="962" dy="0">New owner</tspan><tspan x="962" dy="36">decides</tspan></text><text x="48" y="610" font-size="26" font-weight="500" fill="#111827"><tspan x="48" dy="0">The sale documents determine permissions and continuing obligations.</tspan></text><text x="970" y="645" font-size="22" font-weight="500" fill="#111827"><tspan x="970" dy="0">dataceam.com</tspan></text>
</g>
